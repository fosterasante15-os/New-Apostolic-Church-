<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d55">
  <script>
    /* Theme is applied before first paint so the page never flashes the wrong colours. */
    (function () { try { var t = localStorage.getItem('church-theme-v1'); document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); } catch (_) { document.documentElement.setAttribute('data-theme', 'light'); } })();
  </script>
  <title>Sign in — New Apostolic Church Kumasi Central</title>
  <style>
    :root { --brand-900:#123d55; --brand-800:#15536d; --brand-700:#176783; --brand-600:#247f9c; --brand-100:#e4f3f7; --ink:#172b3a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:40px 16px; color:var(--ink); font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#e7f6fb; }
    .login-background { position:fixed; inset:0; z-index:-2; overflow:hidden; background:#e7f6fb; }
    .login-background img { width:100%; height:100%; object-fit:cover; filter:brightness(.92) saturate(1.05); }
    .login-background::after { position:absolute; inset:0; content:""; background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(231,246,251,.72) 50%,rgba(255,255,255,.9)); }
    .login-wrap { width:min(100%,390px); }
    .logo-wrap { position:relative; z-index:2; display:flex; justify-content:center; margin-bottom:-42px; }
    .logo { width:96px; height:96px; padding:7px; object-fit:contain; border:1px solid var(--brand-100); border-radius:18px; background:#fff; box-shadow:0 8px 25px rgba(18,61,85,.18); }
    .card { padding:62px 32px 30px; border:1px solid var(--brand-100); border-radius:18px; background:rgba(255,255,255,.96); box-shadow:0 22px 70px rgba(18,61,85,.2); }
    h1 { margin:0 0 7px; color:var(--brand-700); text-align:center; font-size:24px; line-height:1.2; }
    .subtitle { margin:0 0 24px; color:#647481; text-align:center; font-size:14px; }
    form { display:grid; gap:16px; }
    label { display:grid; gap:6px; color:#526573; font-size:13px; font-weight:650; }
    input { width:100%; min-height:43px; padding:9px 11px; border:1px solid #cfdbe1; border-radius:8px; color:var(--ink); background:#fff; font:inherit; font-weight:400; outline:none; }
    input:focus { border-color:var(--brand-600); box-shadow:0 0 0 3px rgba(36,127,156,.14); }
    .password-wrap { position:relative; }
    .password-wrap input { padding-right:48px; }
    .show-password { position:absolute; right:0; top:0; height:43px; padding:0 12px; border:0; background:transparent; color:#647481; font-size:16px; cursor:pointer; }
    .submit { min-height:43px; border:0; border-radius:8px; color:#fff; background:linear-gradient(135deg,var(--brand-600),var(--brand-800)); font:inherit; font-weight:700; cursor:pointer; }
    .submit:hover { filter:brightness(.95); }
    .submit:disabled { opacity:.65; cursor:wait; }
    .message { min-height:20px; margin:0; color:#b42318; font-size:13px; text-align:center; }
    .message.ok { color:#1b6b3a; }
    /* ---- Responsive ---- */
    html { -webkit-text-size-adjust:100%; }
    body { min-height:100vh; min-height:100dvh; display:flex; padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
    .login-wrap { margin:auto; width:100%; max-width:390px; }  /* margin:auto centres when there is room and lets the page scroll when there is not */
    h1 { overflow-wrap:anywhere; }
    input { min-height:46px; font-size:16px; }               /* 16px stops iOS Safari zooming into the field */
    .show-password { height:46px; min-width:46px; }
    .submit { min-height:46px; font-size:16px; }
    .login-background img { object-position:center; }
    @media (min-width:768px) { .login-wrap { max-width:420px; } .card { padding:66px 38px 34px; } h1 { font-size:26px; } }
    @media (max-width:480px) { body { padding-top:max(20px,env(safe-area-inset-top)); } .card { padding:58px 20px 24px; border-radius:16px; } .logo { width:84px; height:84px; } .logo-wrap { margin-bottom:-38px; } h1 { font-size:21px; } .subtitle { margin-bottom:20px; } }
    @media (max-width:340px) { .card { padding-inline:14px; } .logo { width:72px; height:72px; } .logo-wrap { margin-bottom:-32px; } .card { padding-top:50px; } h1 { font-size:19px; } }
    @media (max-height:560px) and (orientation:landscape) { body { padding-block:12px; } .login-wrap { max-width:460px; } .logo { width:52px; height:52px; padding:4px; border-radius:12px; } .logo-wrap { margin-bottom:-22px; } .card { padding:30px 24px 14px; } h1 { font-size:18px; margin-bottom:2px; } .subtitle { margin-bottom:8px; font-size:13px; } form { gap:8px; } input, .submit, .show-password { min-height:40px; height:auto; } .show-password { height:40px; } .message { min-height:0; } }
      .theme-toggle { position:fixed; top:max(12px,env(safe-area-inset-top)); right:max(12px,env(safe-area-inset-right)); z-index:5; display:grid; place-items:center; width:44px; height:44px; padding:0; border:1px solid #cfdbe1; border-radius:50%; background:rgba(255,255,255,.92); color:var(--brand-800); cursor:pointer; box-shadow:0 6px 18px rgba(18,61,85,.16); }
    .theme-toggle:hover { background:#fff; } .theme-toggle:focus-visible { outline:2px solid var(--brand-600); outline-offset:2px; }
    .theme-toggle svg { width:20px; height:20px; display:block; } .theme-toggle .icon-sun { display:none; }
    html[data-theme="dark"] .theme-toggle .icon-moon { display:none; } html[data-theme="dark"] .theme-toggle .icon-sun { display:block; }
    @media screen {
html[data-theme="dark"] { color-scheme:dark; --ink:#e3edf2; --brand-700:#8fd2e6; --brand-100:#2a4252; }
html[data-theme="dark"] body { background:#0f1a22; }
html[data-theme="dark"] .login-background img { filter:brightness(.7) saturate(.9); }
html[data-theme="dark"] h1 { color:#8fd2e6; }
html[data-theme="dark"] .theme-toggle { background:rgba(21,33,43,.92); border-color:#35505f; color:#ffd866; }
html[data-theme="dark"] input::placeholder { color:#7f929d; }
html[data-theme="dark"] .subtitle, html[data-theme="dark"] label { color:#a9bac4; }
html[data-theme="dark"] .message.ok { color:#6fd39a; } html[data-theme="dark"] .message { color:#ff8f86; }
:where(html[data-theme="dark"]) body{color:var(--ink);background:#162b32}
:where(html[data-theme="dark"]) .login-background{background:#162b32}
:where(html[data-theme="dark"]) .login-background::after{background:linear-gradient(135deg,rgba(18,25,28,0.72),rgba(22,43,50,0.72) 50%,rgba(18,25,28,0.9))}
:where(html[data-theme="dark"]) .logo{border:1px solid var(--brand-100);background:#12191c}
:where(html[data-theme="dark"]) .card{border:1px solid var(--brand-100);background:rgba(18,25,28,0.96)}
:where(html[data-theme="dark"]) h1{color:var(--brand-text)}
:where(html[data-theme="dark"]) .subtitle{color:#a7b2ba}
:where(html[data-theme="dark"]) label{color:#aebbc5}
:where(html[data-theme="dark"]) input{border:1px solid #394348;color:var(--ink);background:#12191c;outline:none}
:where(html[data-theme="dark"]) input:focus{border-color:var(--brand-600)}
:where(html[data-theme="dark"]) .show-password{border:0;background:transparent;color:#a7b2ba}
:where(html[data-theme="dark"]) .submit{border:0;color:#fff;background:linear-gradient(135deg,var(--brand-600),var(--brand-800))}
:where(html[data-theme="dark"]) .message{color:#eb8b84}
:where(html[data-theme="dark"]) .message.ok{color:#ade8c4}
:where(html[data-theme="dark"]) .theme-toggle{border:1px solid #394348;background:rgba(18,25,28,0.92);color:var(--brand-text)}
:where(html[data-theme="dark"]) .theme-toggle:hover{background:#12191c}
:where(html[data-theme="dark"]) .theme-toggle:focus-visible{outline:2px solid var(--brand-600);outline-offset:2px}
    }
</style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode"><svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <div class="login-background" aria-hidden="true"><img src="img/entrance.webp" alt=""></div>
  <main class="login-wrap">
    <div class="logo-wrap"><img class="logo" id="logo" src="img/logo.png" alt="New Apostolic Church logo"></div>
    <section class="card">
      <h1 id="church-name">New Apostolic Church Kumasi Central</h1>
      <p class="subtitle">Church Management System</p>
      <form id="auth-form" novalidate>
        <label for="auth-email">Email<input id="auth-email" type="email" autocomplete="username" required></label>
        <label for="auth-password">Password<div class="password-wrap"><input id="auth-password" type="password" autocomplete="current-password" required><button class="show-password" id="show-password" type="button" aria-label="Show password" aria-pressed="false">◉</button></div></label>
        <p class="message" id="auth-message" role="alert" aria-live="polite"></p>
        <button class="submit" id="auth-submit" type="submit">Sign in</button>
      </form>
    </section>
  </main>
  <script>
    (() => {
      const USERS_KEY = 'church-reconstruction-users-v1', CRED_KEY = 'church-credentials-v1', AUTH_KEY = 'church-auth-v1', SETTINGS_KEY = 'church-reconstruction-settings-v1';
      /* Built-in main admin account. Only a SHA-256 fingerprint of the password is stored here, never the password itself. */
      const MAIN = { id: 'user-main-admin', email: 'fosterasante15@gmail.com', name: 'Main Admin', role: 'main-admin', status: 'Active', hash: '9c38117b906e1e78d8314d24390770440fb139011db0b5201e065b5bba417731' };
      const $ = id => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const from = params.get('from');
      const HOME = (from && /^[\w.-]+\.html$/.test(from)) ? from : (window.CHURCH_HOME_URL || 'index.html');
      const message = (text, ok) => { $('auth-message').textContent = text; $('auth-message').classList.toggle('ok', Boolean(ok)); };
      const readJson = (k, fallback) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fallback; } catch (_) { return fallback; } };
      const creds = () => { const v = readJson(CRED_KEY, {}); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; };
      const hashPw = async (id, pw) => { if (!(window.crypto && crypto.subtle)) throw new Error('Secure sign-in needs https or localhost.'); const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`church-v1|${id}|${pw}`)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''); };
      const ACT_KEY = 'church-activity-v1';
      function logActivity(entry) {
        try {
          const list = readJson(ACT_KEY, []); const arr = Array.isArray(list) ? list : [];
          arr.push({ id: `a-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`, at: new Date().toISOString(), entity: 'user', ...entry });
          localStorage.setItem(ACT_KEY, JSON.stringify(arr.slice(-500)));
        } catch (_) {}
      }
      function recordLogin(user) {
        try {
          const list = readJson(USERS_KEY, []);
          if (!Array.isArray(list)) return;
          const when = new Date().toISOString();
          const next = list.map(item => item.id === user.id ? { ...item, email: user.email, lastLogin: when, current: true } : { ...item, current: false });
          localStorage.setItem(USERS_KEY, JSON.stringify(next));
        } catch (_) {}
      }

      let signedIn = null; try { signedIn = JSON.parse(sessionStorage.getItem(AUTH_KEY) || 'null'); } catch (_) {}
      if (signedIn && signedIn.role && !params.has('loggedout')) { location.replace(HOME); return; }
      if (params.has('loggedout')) message('You have been logged out.', true);

      /* The login identity always uses the church logo; the Settings logo is for the administration workspace. */
      const settings = readJson(SETTINGS_KEY, null);
      const name = settings && settings.values && String(settings.values.churchName || '').trim();
      if (name) { $('church-name').textContent = name; document.title = `Sign in — ${name}`; }

      $('show-password').addEventListener('click', event => {
        const visible = $('auth-password').type === 'text';
        $('auth-password').type = visible ? 'password' : 'text';
        event.currentTarget.setAttribute('aria-pressed', String(!visible)); event.currentTarget.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
      });

      async function authenticate(email, pw) {
        if (email === MAIN.email) {
          const changed = creds()[MAIN.id];   /* a password changed on the Users page replaces the built-in one */
          const ok = (await hashPw(MAIN.id, pw)) === (changed || MAIN.hash);
          return ok ? { id: MAIN.id, email: MAIN.email, name: MAIN.name, role: MAIN.role, status: MAIN.status } : null;
        }
        const list = readJson(USERS_KEY, []);
        const user = Array.isArray(list) && list.find(u => String(u.email).toLowerCase() === email);
        if (!user || !creds()[user.id] || creds()[user.id] !== await hashPw(user.id, pw)) return null;
        if (String(user.status).toLowerCase() !== 'active') throw new Error('This account is inactive. Contact the main admin.');
        if (user.role === 'member') throw new Error('Member accounts cannot sign in to the administration system.');
        return { id: user.id, email: user.email, name: String(user.email).split('@')[0], role: user.role, status: user.status };
      }

      $('auth-form').addEventListener('submit', async event => {
        event.preventDefault(); message('');
        const email = $('auth-email').value.trim().toLowerCase(), pw = $('auth-password').value;
        if (!email || !$('auth-email').checkValidity()) { message('Enter a valid email address.'); $('auth-email').focus(); return; }
        if (!pw) { message('Enter your password.'); $('auth-password').focus(); return; }
        $('auth-submit').disabled = true;
        try {
          const session = await authenticate(email, pw);
          if (!session) throw new Error('Email or password is incorrect.');
          recordLogin(session);
          logActivity({ action: 'login', userId: session.id, userName: session.name, role: session.role, summary: 'Signed in to the administration system', data: { email: session.email } });
          sessionStorage.setItem(AUTH_KEY, JSON.stringify({ ...session, signedInAt: new Date().toISOString() }));
          location.replace(HOME);
        } catch (e) { if (/incorrect/i.test(e.message || '')) logActivity({ action: 'login-failed', userId: 'unknown', userName: email, summary: 'Failed sign-in attempt', data: { email } }); message(e.message || 'Could not sign in.'); $('auth-submit').disabled = false; }
      });
    })();
  </script>

  <script>
    /* Light / dark theme switch (moon = go dark, sun = go light). The choice is remembered per browser. */
    (() => {
      const KEY = 'church-theme-v1', root = document.documentElement, btn = document.getElementById('theme-toggle');
      if (!btn) return;
      const current = () => root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      function sync() {
        const dark = current() === 'dark';
        btn.setAttribute('aria-pressed', String(dark));
        const label = dark ? 'Switch to light mode' : 'Switch to dark mode';
        btn.setAttribute('aria-label', label); btn.title = label;
        let meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.append(meta); }
        meta.content = dark ? '#0f1a22' : '#123d55';
      }
      btn.addEventListener('click', () => {
        const next = current() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem(KEY, next); } catch (_) {}
        sync();
      });
      window.addEventListener('storage', e => { if (e.key === KEY) { root.setAttribute('data-theme', e.newValue === 'dark' ? 'dark' : 'light'); sync(); } });
      sync();
    })();
  </script>
</body>
</html>
