<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d55">
  <title>Sign in — New Apostolic Church Kumasi Central</title>
  <meta name="description" content="Sign in to the New Apostolic Church Kumasi Central church management portal.">

  <!-- Open Graph / WhatsApp / Facebook Social Preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://newapostolicchurch.vercel.app/login.html">
  <meta property="og:site_name" content="New Apostolic Church Kumasi Central">
  <meta property="og:title" content="Sign in — New Apostolic Church Kumasi Central">
  <meta property="og:description" content="Official church management portal for New Apostolic Church Kumasi Central, Ghana. Cloud-synchronized members, dues, offerings, attendance, and services.">
  <meta property="og:image" content="https://newapostolicchurch.vercel.app/church-preview.jpg">
  <meta property="og:image:secure_url" content="https://newapostolicchurch.vercel.app/church-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="800">
  <meta property="og:image:alt" content="New Apostolic Church Kumasi Central building and sanctuary">

  <!-- Twitter / X Card Preview -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://newapostolicchurch.vercel.app/login.html">
  <meta name="twitter:title" content="Sign in — New Apostolic Church Kumasi Central">
  <meta name="twitter:description" content="Official church management portal for New Apostolic Church Kumasi Central, Ghana.">
  <meta name="twitter:image" content="https://newapostolicchurch.vercel.app/church-preview.jpg">
  <link rel="image_src" href="https://newapostolicchurch.vercel.app/church-preview.jpg">
  <link rel="preconnect" href="https://nsccmfevvkvjhvxrtmax.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://nsccmfevvkvjhvxrtmax.supabase.co">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="css/login.css">
  <script>
    /* Theme and authentication check applied before first paint */
    (function () {
      try {
        var t = localStorage.getItem('church-theme-v1');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        var params = new URLSearchParams(location.search);
        if (!params.has('loggedout')) {
          var s = JSON.parse(sessionStorage.getItem('church-auth-v1') || 'null');
          if (s && typeof s === 'object' && ['admin', 'main-admin', 'account'].includes(String(s.role || '').toLowerCase())) {
            var from = params.get('from');
            var home = (from && /^[\w.-]+\.html$/.test(from)) ? from : 'index.html';
            location.replace(home);
          }
        }
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div class="login-background" aria-hidden="true"><img src="entrance.webp" onerror="this.onerror=null;this.src='img/entrance.webp'" alt="" decoding="async"></div>
  <main class="login-wrap">
    <div class="logo-wrap"><img class="logo" id="logo" src="logo.png" onerror="this.onerror=null;this.src='img/logo.png'" alt="New Apostolic Church logo"></div>
    <section class="card">
      <h1 id="church-name">New Apostolic Church Kumasi Central</h1>
      <p class="subtitle">Church Management System</p>
      <form id="auth-form" novalidate>
        <label id="auth-name-wrap" for="auth-name" hidden style="display:none;">Full Name<input id="auth-name" type="text" autocomplete="name" placeholder="e.g. Samuel Mensah"></label>
        <label for="auth-email">Email<input id="auth-email" type="email" autocomplete="username" required></label>
        <label for="auth-password">Password<div class="password-wrap"><input id="auth-password" type="password" autocomplete="current-password" required><button class="show-password" id="show-password" type="button" aria-label="Show password" aria-pressed="false">◉</button></div></label>
        <p class="message" id="auth-message" role="alert" aria-live="polite"></p>
        <button class="submit" id="auth-submit" type="submit">Sign in</button>
        <div style="text-align:center;margin-top:8px;">
          <button type="button" id="toggle-auth-mode" style="background:none;border:none;padding:0;font:inherit;font-size:13px;color:var(--brand-700);text-decoration:underline;cursor:pointer;">Need an account? Register for access</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Supabase Cloud SDK & Data Client -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase-client.js"></script>
  <script defer src="js/login.js"></script>
</body>
</html>
